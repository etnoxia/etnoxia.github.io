name: Rewrite commit email metadata

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor == 'etnoxia'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rewrite legacy public email
        shell: bash
        run: |
          git config user.name "Etnoxia"
          git config user.email "338580736+etnoxia@users.noreply.github.com"
          FILTER_BRANCH_SQUELCH_WARNING=1 git filter-branch --force --env-filter '
          OLD_EMAIL="hajdu.gergely.etnoxia@gmail.com"
          NEW_EMAIL="338580736+etnoxia@users.noreply.github.com"
          if [ "$GIT_AUTHOR_EMAIL" = "$OLD_EMAIL" ]; then
            export GIT_AUTHOR_EMAIL="$NEW_EMAIL"
          fi
          if [ "$GIT_COMMITTER_EMAIL" = "$OLD_EMAIL" ]; then
            export GIT_COMMITTER_EMAIL="$NEW_EMAIL"
          fi
          ' -- main
          git push --force origin HEAD:main
