<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Etnoxia</title>
  <meta name="description" content="Az Etnoxia honlapja fejlesztés alatt áll.">
  <link rel="canonical" href="https://etnoxia.com/">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Etnoxia">
  <meta property="og:locale" content="hu_HU">
  <meta property="og:title" content="Etnoxia">
  <meta property="og:description" content="A honlap fejlesztés alatt áll.">
  <meta property="og:url" content="https://etnoxia.com/">
  <style>
    :root { color-scheme: light; --site-font: "Segoe UI", Arial, sans-serif; --ink: #0d243e; --soft: #566f86; --line: #e1eaf3; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font: 400 16px/1.5 var(--site-font); -webkit-font-smoothing: antialiased; }
    a { color: inherit; }
    button { font: inherit; }
    :focus-visible { outline: 2px solid #128bd5; outline-offset: 3px; }
    .site-wrap { width: min(1200px, calc(100% - 70px)); min-height: 100vh; margin: 0 auto; display: flex; flex-direction: column; }
    .site-header { position: relative; height: 116px; padding: 0 4px; display: flex; align-items: center; flex-shrink: 0; border-bottom: 1px solid var(--line); background: #fff; }
    .site-header::after { content: ""; position: absolute; inset: auto calc(50% - 50vw) -1px; height: 1px; background: var(--line); pointer-events: none; }
    .brand { display: inline-flex; align-items: center; gap: 15px; color: #121c2b; text-decoration: none; transition: opacity .2s ease; }
    .brand:hover { opacity: .84; }
    .brand-mark { display: block; width: 55px; height: 55px; flex: none; }
    .brand-name { font-size: 43px; font-weight: 700; line-height: 1; letter-spacing: -1.8px; }
    .header-socials { margin-left: auto; align-self: flex-end; margin-bottom: 15px; display: flex; align-items: center; gap: 9px; }
    .header-social-link { width: 40px; height: 40px; display: grid; place-items: center; flex: none; border: 1px solid #d6e3ef; border-radius: 50%; background: #fff; text-decoration: none; transition: transform .16s ease, border-color .16s ease, background .16s ease, box-shadow .16s ease; }
    .header-social-link img { width: 21px; height: 21px; display: block; }
    .header-social-link:hover { transform: translateY(-1px); border-color: #a9cce6; background: #f5fbff; box-shadow: 0 5px 14px rgba(13,70,120,.10); }
    .landing-grid { display: grid; grid-template-columns: minmax(0,1fr) 383px; align-items: start; gap: 33px; padding: 44px 0 72px; }
    .video-section { min-width: 0; }
    .player { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 13px; overflow: hidden; background: #091c34; border: 1px solid #d7e5f2; box-shadow: 0 12px 30px rgba(11,49,83,.12); }
    .video-launch { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(10px,2vw,22px); width: 100%; height: 100%; padding: 15px; color: #e7faff; border: 0; background: radial-gradient(ellipse at 54% 80%,rgba(13,84,148,.25),transparent 67%),linear-gradient(145deg,#0d2b4e,#07182e 70%,#0b253f); text-decoration: none; cursor: pointer; }
    .video-launch:focus-visible { outline-offset: -5px; }
    .video-launch::before { content: ""; position: absolute; width: 145%; height: 68%; left: -23%; bottom: -50%; border-radius: 50%; border: 1px solid rgba(22,178,250,.13); box-shadow: 0 0 28px rgba(0,162,238,.07),0 0 0 28px rgba(0,162,238,.017),0 0 0 70px rgba(0,162,238,.022); transform: rotate(-6deg); pointer-events: none; }
    .video-brand { display: flex; align-items: center; gap: 12px; font-size: clamp(27px,4vw,48px); font-weight: 700; line-height: 1; letter-spacing: -1.5px; z-index: 1; }
    .video-brand img { width: clamp(42px,7vw,75px); height: auto; }
    .play-disc { z-index: 1; width: clamp(43px,6vw,75px); aspect-ratio: 1; display: grid; place-items: center; color: #e7faff; border: 1px solid rgba(90,209,242,.47); background: rgba(11,68,116,.68); border-radius: 50%; box-shadow: 0 0 28px rgba(25,147,232,.15); }
    .play-disc svg { width: 35%; height: 35%; fill: currentColor; transform: translateX(2px); }
    .video-launch:hover .play-disc { background: #11629b; }
    .video-label { position: relative; z-index: 1; font-size: clamp(11px, 1.5vw, 15px); line-height: 1.4; text-align: center; color: #e7faff; }
    .status-panel { overflow: hidden; color: var(--ink); background: #fff; border: 1px solid #dce9f2; border-radius: 14px; box-shadow: 0 12px 31px rgba(15,65,110,.07); }
    .status-topline { height: 4px; background: linear-gradient(90deg,#0876ce 0%,#1ebfe3 37%,#edf7fc 37%,#edf7fc 100%); }
    .status-inner { padding: 28px 24px 30px; }
    h1 { margin: 0; font-size: 26px; line-height: 1.32; letter-spacing: -.035em; font-weight: 700; }
    .skip-link:not(:focus) { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    .skip-link:focus { position: absolute; z-index: 10; top: 12px; left: 12px; padding: 12px; border-radius: 8px; background: #fff; color: #071b33; }
    @media (max-width: 1050px) { .site-wrap { width: calc(100% - 50px); } .landing-grid { grid-template-columns: minmax(0,1fr) 320px; gap: 25px; } }
    @media (max-width: 790px) { .site-wrap { width: min(650px, calc(100% - 36px)); } .site-header { height: 96px; } .brand-mark { width: 49px; height: 49px; } .brand-name { font-size: 36px; } .header-socials { margin-bottom: 12px; gap: 7px; } .header-social-link { width: 37px; height: 37px; } .header-social-link img { width: 20px; height: 20px; } .landing-grid { grid-template-columns: minmax(0,1fr); padding: 28px 0 48px; gap: 24px; } }
    @media (max-width: 450px) { .site-wrap { width: calc(100% - 28px); } .site-header { height: 83px; } .brand { gap: 10px; } .brand-mark { width: 41px; height: 41px; } .brand-name { font-size: 31px; } .header-socials { margin-bottom: 10px; gap: 6px; } .header-social-link { width: 34px; height: 34px; } .header-social-link img { width: 18px; height: 18px; } .status-inner { padding: 22px 19px; } h1 { font-size: 24px; } }
    @media (max-width: 345px) { .brand { gap: 7px; } .brand-mark { width: 36px; height: 36px; } .brand-name { font-size: 28px; } .header-socials { gap: 4px; } .header-social-link { width: 30px; height: 30px; } }
    @media (prefers-reduced-motion: reduce) { .brand, .header-social-link { transition: none; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Ugrás a tartalomra</a>
  <div class="site-wrap">
    <header class="site-header">
      <a class="brand" href="./index.html" aria-label="Etnoxia – főoldal">
        <img class="brand-mark" src="./assets/etnoxia-mark.svg" alt="" width="55" height="55">
        <span class="brand-name">Etnoxia</span>
      </a>
      <nav class="header-socials" aria-label="Etnoxia közösségi oldalak">
        <a class="header-social-link" href="https://www.linkedin.com/company/etnoxia" target="_blank" rel="noopener noreferrer" aria-label="Etnoxia a LinkedInen"><img src="./assets/linkedin.svg" alt="" width="21" height="21"></a>
        <a class="header-social-link" href="https://www.facebook.com/etnoxia" target="_blank" rel="noopener noreferrer" aria-label="Etnoxia a Facebookon"><img src="./assets/facebook.svg" alt="" width="21" height="21"></a>
        <a class="header-social-link" href="https://www.instagram.com/etnoxia.hu/" target="_blank" rel="noopener noreferrer" aria-label="Etnoxia az Instagramon"><img src="./assets/instagram.svg" alt="" width="21" height="21"></a>
      </nav>
    </header>
    <main id="main" class="landing-grid">
      <section class="video-section" aria-label="Etnoxia logóvideó">
        <div id="main-player" class="player">
          <a id="video-launch" class="video-launch" href="https://www.youtube.com/watch?v=pcurUVPhOLA" target="_blank" rel="noopener noreferrer" aria-label="Intró videó lejátszása a youtube.com-on (új lapon)">
            <span class="video-brand" aria-hidden="true"><img src="./assets/etnoxia-mark.svg" alt="">Etnoxia</span>
            <span class="play-disc" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m9 6 9 6-9 6V6Z"/></svg></span>
            <span class="video-label">Intró videó lejátszása a youtube.com-on</span>
          </a>
        </div>
      </section>
      <section class="status-panel" aria-labelledby="status-heading">
        <div class="status-topline" aria-hidden="true"></div>
        <div class="status-inner"><h1 id="status-heading">A honlap fejlesztés alatt áll</h1></div>
      </section>
    </main>
  </div>
</body>
</html>
